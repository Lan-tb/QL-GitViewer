name: Build & Release

on:
  push:
    branches:
      - 'feature/**'
    tags: ['*']
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 子模块 QuickLook.Common 是 ProjectReference 的目标，不拉就构建不了。
          submodules: recursive
          # update-version.ps1 靠 `git describe` 取版本，浅克隆拿不到标签和提交
          # 历史，版本号会退化成提交哈希。必须要完整历史。
          fetch-depth: 0

      - name: Build (Release)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) {
              throw 'MSBuild was not found on the Windows runner.'
          }

          Write-Host "Using MSBuild: $msbuild"
          & $msbuild QuickLook.Plugin.GitViewer.sln -restore -p:Configuration=Release -m
          if ($LASTEXITCODE -ne 0) {
              throw "MSBuild failed with exit code $LASTEXITCODE."
          }

      - name: Verify version
        shell: pwsh
        run: |
          $config = [xml](Get-Content QuickLook.Plugin.Metadata.config)
          $version = $config.Metadata.Version
          Write-Host "Metadata version: $version"

          if ('${{ github.ref_type }}' -eq 'tag') {
              $tag = '${{ github.ref_name }}'
              if ($version -ne $tag) {
                  throw "版本号 '$version' 与标签 '$tag' 不符，git describe 没有取到该标签。"
              }
          }

      - name: Pack
        id: pack
        shell: pwsh
        run: ./Scripts/pack-zip.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickLook.Plugin.GitViewer-${{ steps.pack.outputs.version }}
          path: ${{ steps.pack.outputs.plugin }}
          if-no-files-found: error

      - name: Create release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' `
              '${{ steps.pack.outputs.plugin }}' `
              --title '${{ github.ref_name }}' `
              --generate-notes
